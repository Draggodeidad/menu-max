name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Revisar migraciones de Drizzle
        run: pnpm --filter database exec drizzle-kit check
      - name: Verificar el OpenAPI versionado
        run: |
          pnpm --filter api openapi:export
          git ls-files --error-unmatch docs/api/openapi.json
          git diff --exit-code HEAD -- docs/api/openapi.json
      - name: Buscar secretos en los cambios con Gitleaks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks

          revision="$BASE_SHA..$HEAD_SHA"
          if [[ "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            revision="$HEAD_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose \
            --log-opts="--diff-merges=first-parent $revision" .
      - name: Verificar el empaquetado de los Workers
        run: |
          pnpm --filter api exec wrangler deploy --dry-run --env=""
          pnpm --filter web exec wrangler deploy --dry-run --env=""
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
